name: Release

# Wydanie powstaje z tagu `vMAJOR.MINOR.PATCH`. Workflow sprawdza zgodność tagu z `Version::CURRENT` i z wpisem
# w CHANGELOG.md, a potem tworzy GitHub Release z notatkami z changelogu. Schemat: docs/wydania.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

# Uprawnienia nadawane na poziomie jobu (najmniejsze potrzebne).
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: write  # tworzenie GitHub Release z notatkami z changelogu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          coverage: none
      - name: Zgodność tagu z wersją i changelogiem
        run: bash scripts/ci/check-release.sh "${GITHUB_REF_NAME}"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash scripts/ci/changelog-section.sh "$version" > release-notes.md
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md --verify-tag $prerelease
