name: PR title

# Tytuł PR trafia do historii main (squash) i do CHANGELOG, więc musi dać się sklasyfikować wg Conventional Commits.
# Zły tytuł po cichu psuje klasyfikację zmian (major/minor/patch), więc ta kontrola odrzuca tytuły niesklasyfikowalne.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# Uprawnienia nadawane na poziomie jobu (najmniejsze potrzebne).
permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    permissions:
      pull-requests: read  # odczyt tytułu PR przez action-semantic-pull-request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Typy zgodne z Conventional Commits i z regułą SemVer dla bramek (docs/wydania.md):
          # feat to minor lub major (nowa bramka), fix i pozostałe to patch.
          types: |
            feat
            new
            fix
            bug
            hotfix
            docs
            chore
            refactor
            style
            test
            ci
            perf
            build
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter,
            e.g. "feat: add GA4 event export".
