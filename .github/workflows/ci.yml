name: CI

# Kontrole repo pc. Repo jest publiczne, więc minuty Actions na standardowych runnerach są darmowe.
# Każdy job kontrolny jest wymieniony w `quality-gate` (wymagana kontrola na `main`, razem z `pr-title`). Dodając job,
# dopisz go do `needs` i do scripts/quality/quality-gate.js (test pilnuje zgodności).
# Kontrole ujemne (scripts/ci/negative-controls.sh i krok w secret-scan) dowodzą, że bramki zatrzymują znany błąd:
# zielone CI samo tego nie pokazuje.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Wersja PHP zgodna z Nexusem (8.4.x). Akcja shivammathur/setup-php (spoza actions/*) jest przypięta do SHA commitu tagu 2.40.0.
  PHP_VERSION: "8.4"

jobs:
  composer:
    name: composer validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict --no-check-lock

  pint:
    name: Pint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer lint

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer stan

  phpmd:
    name: PHPMD (surowy zestaw)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer smells

  tests:
    name: Pest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test

  negative-controls:
    name: Kontrole ujemne bramek
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer negative

  privacy:
    name: Skan prywatności
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/ci/privacy-scan.sh

  # Klasyfikator zakresu (#40) w profilu enforce-all: CI nie zawęża niczego, tylko drukuje, co hook pominąłby lokalnie
  # (informacyjnie), i dowodzi, że klasyfikator działa na pełnej historii. Job biegnie zawsze, także dla samych *.md.
  scope:
    name: Zakres bramek (enforce-all)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Klasyfikator zakresu (enforce-all)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            php bin/pc scope --profile=enforce-all --base="$BASE_SHA"
          else
            php bin/pc scope --profile=enforce-all
          fi

  # Bramki plików GitHub (zgłoszenia #5, #43, #44, #45, #46, #6). Komendy i kontrole ujemne są w jednym skrypcie,
  # scripts/ci/github-gate.sh, który woła też hook pre-commit (ten sam zestaw lokalnie i w CI). Narzędzia w przypiętych
  # wersjach: binarki z sumą SHA-256, paczki Pythona z hashami wszystkich zależności (scripts/ci/requirements-lint.txt).
  # W CI biegną zawsze (przebiegi trwają kilkanaście sekund); zakres plików skraca tylko lokalny hook (klasyfikator, profil local-narrow).
  actionlint:
    name: actionlint (workflow GitHub Actions)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      # shellcheck jest preinstalowany na runnerze ubuntu, więc actionlint sprawdza też skrypty w krokach `run:`.
      - name: actionlint (z kontrolą ujemną)
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          shellcheck --version | head -2
          bash scripts/ci/github-gate.sh actionlint

  zizmor:
    name: zizmor (bezpieczeństwo workflow, persona pedantic)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install lint tools (hashed)
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet --require-hashes -r scripts/ci/requirements-lint.txt
      # Z tokenem działają audyty online (impostor-commit, known-vulnerable-actions). Konfiguracja: .github/zizmor.yml.
      - name: zizmor (z kontrolą ujemną)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="$RUNNER_TEMP/lint/bin:$PATH"
          bash scripts/ci/github-gate.sh zizmor

  yamllint:
    name: yamllint (styl i poprawność YAML)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install lint tools (hashed)
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet --require-hashes -r scripts/ci/requirements-lint.txt
      - name: yamllint (z kontrolą ujemną)
        run: |
          export PATH="$RUNNER_TEMP/lint/bin:$PATH"
          bash scripts/ci/github-gate.sh yamllint

  schema:
    name: check-jsonschema (schematy plików GitHub)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install lint tools (hashed)
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet --require-hashes -r scripts/ci/requirements-lint.txt
      - name: check-jsonschema (z kontrolą ujemną)
        run: |
          export PATH="$RUNNER_TEMP/lint/bin:$PATH"
          bash scripts/ci/github-gate.sh schema

  pinact:
    name: pinact (akcje przypięte do SHA z komentarzem wersji)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinact
        env:
          PINACT_VERSION: "5.0.2"
          PINACT_SHA256: "7f003d8f51e984c2264d2009d430e3e0e87ae404a0e2dc2a9a277b0f731bf5b7"
        run: |
          archive="pinact_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/suzuki-shunsuke/pinact/releases/download/v${PINACT_VERSION}/$archive"
          echo "$PINACT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" pinact
      # Z tokenem pinact sprawdza także, czy komentarz wersji zgadza się z przypiętym SHA (--verify-comment).
      - name: pinact (z kontrolą ujemną)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          bash scripts/ci/github-gate.sh pinact

  shellcheck:
    name: ShellCheck (skrypty .sh i hooki)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ShellCheck jest preinstalowany na runnerze ubuntu; wersja wynika z obrazu (wypisana w logu).
      - name: ShellCheck (z kontrolą ujemną)
        run: |
          shellcheck --version | head -2
          bash scripts/ci/github-gate.sh shellcheck

  process-tests:
    name: Testy skryptów procesu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Bramka audytu zgłoszeń, etykiety i job zbiorczy quality-gate (zob. docs/proces.md).
      - run: npm test

  secret-scan:
    name: Skan sekretów (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks-action w organizacji wymaga licencji (GITLEAKS_LICENSE); sam skaner jej nie wymaga.
      # Wersja i SHA-256 jak w pozostałych repozytoriach CityCouriers (zgodne z gitleaks_8.30.1_checksums.txt wydania).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Bez --first-parent i --no-merges, bo pomijają commity boczne i zmiany w samym merge'u.
          # --diff-merges=first-parent pokazuje merge wobec pierwszego rodzica, także rozwiązanie konfliktu.
          scope=--all
          if [ "$EVENT_NAME" = pull_request ]; then
            scope="${BASE_SHA}..${HEAD_SHA}"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--diff-merges=first-parent $scope" .

      - name: Kontrola ujemna, skaner musi wykryć sztuczny token
        run: |
          set -u
          scan_dir="$(mktemp -d)"
          printf 'token = "github_pat_%s"\n' "$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 82)" > "$scan_dir/fake.env"
          if "$RUNNER_TEMP/gitleaks" dir "$scan_dir" --redact --no-banner; then
            echo "BŁĄD: gitleaks przepuścił sztuczny token. Skaner nie działa."
            exit 1
          fi
          echo "OK: gitleaks zatrzymał sztuczny token."

  # Job zbiorczy: jedna kontrola wymagana przez `main` (razem z `pr-title`). Zielony tylko, gdy każdy job z listy
  # wymaganych ma wynik `success` (pominięty, anulowany i brakujący dają czerwony); lista jest w
  # scripts/quality/quality-gate.js, a test pilnuje jej zgodności z tym plikiem. `needs` działa tylko w obrębie tego
  # workflow, więc nowe joby kontrolne dopisujemy tutaj i w skrypcie.
  quality-gate:
    name: quality-gate
    if: always()
    needs: [composer, pint, phpstan, phpmd, tests, negative-controls, privacy, secret-scan, process-tests,
            actionlint, zizmor, yamllint, schema, pinact, shellcheck, scope]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Evaluate required jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: node scripts/quality/quality-gate.js
