name: Issue audit gate

# Bramka audytu specyfikacji issue (#139).
#
# Issue objęta bramką i będąca w zakresie (`P0`/`P1`/`P2` albo `T2`/`T3`) ma
# jawny stan audytu: `audit:pending`, `audit:ok` albo `audit:changes`. Recenzent
# rozstrzyga komentarzem `/audit-ok` albo `/audit-changes`; liczy się tylko
# komentarz strony przeciwnej autorowi treści, nieedytowany po publikacji
# (#231). Edycja treści unieważnia rozstrzygnięcie i cofa stan do
# `audit:pending`.
#
# Ten workflow NIE jest zestawem handlerów zdarzeń. Przy `cancel-in-progress:
# false` GitHub trzyma w grupie tylko jeden run `pending` i ANULUJE go, gdy
# przyjdzie kolejne zdarzenie — zdarzenie nie jest opóźniane, tylko tracone.
# Dlatego każdy run czyta aktualny stan issue i wylicza z niego etykietę
# docelową (reconciler). Utrata jednego runu nie gubi semantyki, bo kolejny
# naprawia stan. Cała logika decyzyjna i jej testy żyją w
# scripts/quality/issue-audit-gate.js oraz modułach obok (`issue-audit-sides.js`,
# `issue-audit-fetch.js`); testy w test/issue-audit-gate.test.js.
#
# Bramka jest konwencją, nie mechanicznym zamkiem: GitHub nie potrafi
# zablokować pracy nad issue. Etykieta jest sygnałem dla agenta i dla człowieka.
#
# Ten sam przebieg pilnuje triage'u (#211): brakujące etykiety wymaganych rodzin
# bierze z tabeli „Triage” w treści, a gdy to nie wystarcza, nakłada
# `needs-triage`. Stan audytu liczy od razu z nowymi etykietami, bo zapis
# z GITHUB_TOKEN nie uruchamia kolejnego runu.

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened]
  # `edited` i `deleted` (#231): komentarz edytowany po publikacji przestaje być
  # werdyktem, a usunięty znika ze stanu; bez tych zdarzeń zmiana czekałaby na
  # przypadkowy kolejny przebieg.
  issue_comment:
    types: [created, edited, deleted]

# Uprawnienia nadawane na poziomie jobu (najmniejsze potrzebne).
permissions: {}

# Nie anulujemy runów w locie: reconciler ma dokończyć zapis etykiety.
concurrency:
  group: issue-audit-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile audit state
    permissions:
      contents: read  # sparse checkout skryptów bramki
      issues: write  # etykiety audit:*, triage i komentarz-znacznik
    # GitHub wysyła `issue_comment` także dla pull requestów — bez tego guarda
    # `/audit-ok` napisane w PR manipulowałoby etykietami PR-a.
    #
    # Komentarze zawężamy do osób, które i tak mogą rozstrzygać; ktokolwiek inny
    # nie pali minut Actions. Sam komentarz-znacznik publikuje `github-actions`,
    # który tu nie przechodzi, więc nie ma pętli. Wyjątek: `deleted` przechodzi
    # zawsze, bo usuwający komentarz bywa już kimś innym niż jego autor, a
    # usunięty werdykt musi zmienić stan niezależnie od tego, kto go usunął.
    if: >-
      !github.event.issue.pull_request &&
      (github.event_name == 'issues' ||
       github.event.action == 'deleted' ||
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      # Moment uruchomienia bramki W TYM repozytorium (północ UTC w dniu założenia repo; obejmuje zgłoszenia
      # planu bramek w zakresie). Nie cofaj tej daty, bo to cichy backfill.
      # Trzymamy go w workflow, a nie w skrypcie, bo ten sam skrypt obsługuje też
      # inne repozytoria, które weszły do bramki innego dnia. Cofnięcie tej daty
      # zrobiłoby cichy backfill całego archiwum.
      GATE_ACTIVE_SINCE: "2026-11-08T00:00:00Z"
      # Triage (#211 w wordpress-automation): issue utworzona od tej chwili bez
      # wymaganych etykiet dostaje je z tabeli „Triage” w treści albo
      # `needs-triage`. Osobna data, bo data startu bramki objęłaby wstecz całe
      # archiwum. Rodziny wymagane też są własnością repozytorium: tutaj P i T.
      TRIAGE_ACTIVE_SINCE: "2026-11-08T00:00:00Z"
      TRIAGE_REQUIRED: "P,T"
    steps:
      - name: Checkout gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/quality/issue-audit-gate.js
            scripts/quality/issue-audit-sides.js
            scripts/quality/issue-audit-fetch.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Reconcile audit state
        id: gate
        run: >-
          node scripts/quality/issue-audit-gate.js --issue "$ISSUE"
          --gate-active-since "$GATE_ACTIVE_SINCE"
          --triage-active-since "$TRIAGE_ACTIVE_SINCE"
          --triage-required "$TRIAGE_REQUIRED"

      # Etykieta mówi, że stan się cofnął, ale nie mówi dlaczego, a historii
      # edycji issue nikt nie czyta. Marker jest śladem dla człowieka —
      # poprawność bramki NIE zależy od tego, czy powstał.
      - name: Leave a marker comment on reset
        if: >-
          steps.gate.outputs.action == 'set' &&
          steps.gate.outputs.label == 'audit:pending' &&
          steps.gate.outputs.previous != '' &&
          steps.gate.outputs.previous != 'audit:pending'
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            "Stan audytu cofnięty z \`${STEPS_GATE_OUTPUTS_PREVIOUS}\` do \`audit:pending\`: po rozstrzygnięciu zmieniła się \
          treść issue, jej autorstwo (podpis, \`by:agent\`) albo komentarz z werdyktem (edycja lub usunięcie). \
          Opisz w komentarzu, co się zmieniło — sama etykieta tego nie powie."
        env:
          STEPS_GATE_OUTPUTS_PREVIOUS: ${{ steps.gate.outputs.previous }}
